# https://docs.astral.sh/ruff/configuration/
# CI: azure-pipelines-for-app-image.yml runs `ruff check .`

target-version = "py312"

[lint.per-file-ignores]
# Test bootstrap: env vars and GCP stubs must run before importing app.main
"tests/conftest.py" = ["E402", "I001"]
"tests/deep_integration_check.py" = ["E402", "I001"]

# Intentional broad catches: startup fallbacks, LLM boundary, tracing init
"app/main.py" = ["BLE001"]
"app/mod_intent_extraction.py" = ["BLE001"]
"app/utils/tracing.py" = ["BLE001"]
"app/utils/generation_config.py" = ["BLE001"]
